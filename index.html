<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>یه سوال ازت دارم ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 15%, #ffb6d5 0%, transparent 30%),
        linear-gradient(135deg, #ff758c, #ff7eb3, #b56cff);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      color: white;
    }

    /* درخشش‌های پس‌زمینه */
    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,.15);
      filter: blur(60px);
      animation: glow 5s ease-in-out infinite alternate;
    }

    body::before {
      top: -100px;
      right: -80px;
    }

    body::after {
      bottom: -100px;
      left: -80px;
      animation-delay: 2s;
    }

    @keyframes glow {
      from { transform: scale(.8); opacity: .4; }
      to { transform: scale(1.3); opacity: .8; }
    }

    /* گل‌های شناور */
    .flower {
      position: absolute;
      top: -80px;
      font-size: 42px;
      animation: fall linear infinite;
      user-select: none;
      z-index: 1;
    }

    @keyframes fall {
      0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(60vh) rotate(360deg);
        opacity: 0;
      }
    }

    .card {
      width: min(90%, 520px);
      padding: 45px 25px;
      text-align: center;
      border-radius: 30px;
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.3);
      box-shadow: 0 20px 60px rgba(80, 0, 50, .25);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 5;
      animation: appear 1s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(.8) translateY(30px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .heart {
      font-size: 75px;
      animation: heartbeat 1.2s infinite;
      margin-bottom: 15px;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.2); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
    }

    h1 {
      font-size: clamp(25px, 7vw, 40px);
      margin-bottom: 15px;
      text-shadow: 0 3px 15px rgba(0,0,0,.2);
    }

    .question {
      font-size: clamp(19px, 5vw, 27px);
      margin-bottom: 35px;
      line-height: 1.8;
    }

    .buttons {
      position: relative;
      height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
    }

    button {
      border: none;
      border-radius: 50px;
      padding: 14px 30px;
      font-size: 18px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    #yes {
      background: white;
      color: #e83e73;
      box-shadow: 0 8px 25px rgba(0,0,0,.18);
    }

    #yes:hover {
      transform: scale(1.08);
    }

    #no {
      position: relative;
      background: rgba(255,255,255,.25);
      color: white;
      border: 1px solid rgba(255,255,255,.4);
    }

    .success {
      display: none;
    }

    .success h2 {
      font-size: clamp(27px, 7vw, 42px);
      margin-bottom: 20px;
      animation: pop .7s ease;
    }

    .success p {
      font-size: 21px;
      line-height: 2;
    }

    .big-heart {
      font-size: 100px;
      animation: heartbeat .9s infinite;
      margin-bottom: 15px;
    }

    @keyframes pop {
      0% { transform: scale(0); }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* قلب‌های بعد از بله */
    .love {
      position: fixed;
      bottom: -50px;
      font-size: 30px;
      animation: rise 4s linear forwards;
      z-index: 10;
      pointer-events: none;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(.5) rotate(0);
        opacity: 0;
      }
      15% { opacity: 1; }
      100% {
        transform: translateY(-110vh) scale(1.5) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 500px) {
      .card {
        padding: 35px 18px;
      }

      .heart {
        font-size: 65px;
      }

      button {
        padding: 13px 24px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- گل‌های شناور در نیمه بالایی -->
  <div class="flower" style="left:5%; animation-duration:7s; animation-delay:0s;">🌹</div>
  <div class="flower" style="left:18%; animation-duration:9s; animation-delay:2s;">🌹</div>
  <div class="flower" style="left:33%; animation-duration:8s; animation-delay:1s;">🌹</div>
  <div class="flower" style="left:50%; animation-duration:10s; animation-delay:3s;">🌹</div>
  <div class="flower" style="left:67%; animation-duration:7s; animation-delay:1.5s;">🌹</div>
  <div class="flower" style="left:82%; animation-duration:9s; animation-delay:4s;">🌹</div>
  <div class="flower" style="left:94%; animation-duration:8s; animation-delay:2.5s;">🌹</div>

  <main class="card">

    <!-- صفحه سؤال -->
    <section id="questionPage">
      <div class="heart">❤️</div>

      <h1>یه سوال مهم ازت دارم 🥺</h1>

      <p class="question">
        میای سر قرار با من؟ 🌹
      </p>

      <div class="buttons">
        <button id="yes">بله 🥰</button>
        <button id="no">خیر 😂</button>
      </div>
    </section>

    <!-- صفحه بعد از بله -->
    <section class="success" id="successPage">
      <div class="big-heart">💖</div>

      <h2>می‌دونستم بله میگی! 😍</h2>

      <p>
        پس قرارمون قطعی شد 🌹<br>
        قول میدم یه قرار فوق‌العاده برات بسازم ❤️<br>
        منتظرتم خوشگلم 🥰✨
      </p>
    </section>

  </main>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const questionPage = document.getElementById("questionPage");
    const successPage = document.getElementById("successPage");

    /* دکمه خیر فرار می‌کند */
    function runAway() {
      const padding = 20;

      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const x = Math.max(padding, Math.random() * maxX);
      const y = Math.max(padding, Math.random() * maxY);

      noBtn.style.position = "fixed";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.zIndex = "100";
    }

    noBtn.addEventListener("mouseenter", runAway);
    noBtn.addEventListener("touchstart", function(e) {
      e.preventDefault();
      runAway();
    });

    noBtn.addEventListener("click", runAway);

    /* کلیک روی بله */
    yesBtn.addEventListener("click", () => {
      questionPage.style.display = "none";
      successPage.style.display = "block";

      createLove();
    });

    /* ساخت قلب‌های شناور */
    function createLove() {
      const emojis = ["❤️", "💖", "💕", "💗", "🌹", "🥰", "✨"];

      for (let i = 0; i < 45; i++) {
        setTimeout(() => {
          const love = document.createElement("div");
          love.className = "love";
          love.textContent =
            emojis[Math.floor(Math.random() * emojis.length)];

          love.style.left = Math.random() * 100 + "vw";
          love.style.animationDuration =
            (3 + Math.random() * 3) + "s";

          love.style.fontSize =
            (20 + Math.random() * 35) + "px";

          document.body.appendChild(love);

          setTimeout(() => love.remove(), 6500);
        }, i * 100);
      }
    }
  </script>

</body>
</html>
